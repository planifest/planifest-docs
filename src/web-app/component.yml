# Planifest Component Manifest
id: "web-app"
name: "Planifest Web App"
feature: "0000001-doc-nav"
version: "0.3.0"
status: "active"
type: "microfrontend"
domain: "documentation-site"
summary: "Static Vite site that renders the Planifest homepage and documentation pages."
systemContext: "Deployed as a GitHub Pages static site. Consumes planifest-docs markdown files at build time via build-docs.js and serves them as HTML."

responsibilities:
  - "Render the Planifest homepage with hero, structure section, and navigation"
  - "Build doc pages from planifest-docs markdown at build time"
  - "Serve doc pages with consistent nav, theme toggle, and Mermaid diagram support"
  - "Generate and serve a doc sitemap"
  - "Maintain docs.manifest.json as the single source of truth for page order and titles"
  - "Inject manifest-driven top nav links and prev/next pagination into every doc page at build time"

exceptions:
  - "Must not process user-supplied content at runtime (static site only)"
  - "Must not own or modify planifest-docs markdown — that is the planifest-docs component's concern"

stack:
  language: "typescript"
  runtime: "node"
  framework: "vite"
  frontend: "none"
  styling: "vanilla-css"
  componentLibrary: "none"
  database: "none"
  orm: "none"
  testing: "none"
  iac: "none"
  cloud: "none"
  compute: "none"
  ci: "github-actions"

contract:
  apiSpec: "none"
  inputs:
    - name: "planifest-docs/*.md"
      type: "filesystem"
      description: "Markdown source files consumed at build time by scripts/build-docs.js"
    - name: "public/sitemap-data.json"
      type: "filesystem"
      description: "JSON sitemap generated by build-docs.js, consumed at runtime by nav hamburger menu"
    - name: "src/web-app/docs.manifest.json"
      type: "filesystem"
      description: "Page order manifest consumed by build-docs.js to generate top nav and prev/next links"
  outputs:
    - name: "dist/"
      type: "filesystem"
      description: "Built static site deployed to GitHub Pages"
  consumedBy: []
  consumes:
    - "planifest-docs"
  breakingChangePolicy: "requires-human-approval"

data:
  ownsData: false
  dataContract: "none"
  tables: []
  schemaVersion: "0.0.0"
  migrationPath: "none"

scope:
  inScope:
    - "Homepage layout and styling"
    - "Doc page build pipeline (build-docs.js)"
    - "Theme toggle (light/dark)"
    - "Mobile nav (hamburger menu with dynamic doc links)"
    - "Mermaid diagram rendering"
    - "Hash anchor scroll behaviour"
  outOfScope:
    - "Documentation content (owned by planifest-docs)"
    - "Framework source (owned by planifest-framework)"
  deferred:
    - "Search functionality"
    - "Doc versioning"
    - "Interactive playground"
    - "Active-page highlight in top nav"

risk:
  level: "low"
  items:
    - "build-docs.js must be run before vite build/dev — order enforced by npm scripts"
    - "scroll-margin-top: 72px hardcoded to nav height — must be updated if nav height changes"
    - "docs.manifest.json must be updated when adding new doc pages — build-docs.js warns on undeclared pages"
    - "{{DOC_NAV_LINKS}} placeholder must be present in doc-template.html if using external template"

quality:
  testCoverage:
    unit: 0
    integration: 0
    e2e: 0
  techDebt:
    - "No automated tests — build validation is manual (run npm run build)"
    - "location.reload() on theme toggle forces full page reload to re-render Mermaid SVGs"
    - "8 high Vite dev-server vulnerabilities — run npm audit fix (dev-only, no production impact)"
  quirks:
    - "Doc HTML files in src/web-app/docs/ are build artefacts — must be regenerated via build-docs.js before vite dev picks up changes"
    - "Component docs in component-docs/ (not docs/) to avoid conflict with HTML build output directory"
    - "Adding a new doc page requires two steps: add .md to planifest-docs/ AND add entry to docs.manifest.json"

pipeline:
  templateVersion: "1.0.0"
  featureMode: "retrofit"
  domainKnowledgePath: "plan/current"

metadata:
  createdAt: "2026-05-16"
  updatedAt: "2026-05-16"
  createdBy: "agent"
  lastModifiedBy: "agent"
  skill: "planifest-spec-agent"
  tool: "Claude Code"
  model: "claude-sonnet-4-6"
