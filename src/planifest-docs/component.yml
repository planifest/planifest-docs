# Planifest Component Manifest
id: "planifest-docs"
name: "Planifest Docs"
feature: "0000003-p9-phase-docs"
version: "0.1.0"
status: "active"
type: "content"
domain: "documentation"
summary: "Markdown source files for the Planifest documentation website."
systemContext: "Consumed at build time by the web-app component (src/web-app). Deployed as static HTML to GitHub Pages. Owned by the docs team; updated via Planifest pipeline runs."

pipeline:
  domainKnowledgePath: plan

purpose:
  responsibilities:
    - "Own and maintain the canonical Planifest documentation as markdown source files"
    - "Document the pipeline phases, routing, standards, templates, and project operations"
    - "Provide the agent skills reference and getting-started guide"
  notResponsibleFor:
    - "Rendering or serving documentation — that is the web-app component's concern"
    - "Navigation structure or page manifest — managed by web-app/docs.manifest.json"
    - "Framework skill files — those live in planifest-framework/"

scope:
  includes:
    - "planifest-docs/*.md — all documentation pages"
  excludes:
    - "src/web-app/ — build tooling and rendering"
    - "planifest-framework/ — framework skills and templates"

risk:
  level: "low"
  items:
    - "Doc content can drift from framework skill files when the framework is updated without a corresponding docs feature run"
    - "Anchor links to non-existent headings in other pages produce silent 404s in the static site"

contract:
  inputs: []
  outputs:
    - name: "planifest-docs/*.md"
      type: "filesystem"
      description: "Markdown source files consumed at build time by src/web-app/scripts/build-docs.js"
  consumedBy:
    - "web-app"
  consumes: []
  breakingChangePolicy: "requires-human-approval"

quality:
  testCoverage:
    unit: 0
    integration: 0
    e2e: 0
  techDebt:
    - "No automated link-checking — broken anchor links are caught only on human review"
