# Planifest Component Manifest
id: "planifest-docs"
name: "Planifest Documentation"
feature: "getting-started-gaps"
version: "0.2.0"
status: "active"
type: "component-pack"
domain: "documentation"
summary: "User-facing documentation for Planifest v0.10 — 10 markdown pages covering overview, getting started, pipeline, routing, and reference material."
systemContext: "Consumed at build time by src/web-app/scripts/build-docs.js which converts the markdown to HTML. No runtime dependency — purely a content source."

responsibilities:
  - "Document what Planifest is and the problem it solves (01-overview)"
  - "Document installation and first-run setup (02-getting-started)"
  - "Document the full pipeline and all 9 phases (03-pipeline)"
  - "Document the three routing tracks and decision logic (04-routing)"
  - "Document the Change Pipeline in detail (05-change-pipeline)"
  - "Document the Fast Path criteria and steps (06-fast-path)"
  - "Document the Retrofit adoption mode (07-retrofit)"
  - "Provide Agent Skills Reference — all pipeline and specialist skills (08-agent-skills-reference)"
  - "Provide Standards Reference — all 15 standards (09-standards)"
  - "Provide Templates Reference — all ~20 templates with field descriptions (10-templates)"

exceptions:
  - "Must not contain roadmap content or planned-but-unbuilt features"
  - "Must not contain internal planning documents (those belong in plan/)"
  - "Must not reference implementation details that belong in src/ component manifests"

stack:
  language: "markdown"
  runtime: "none"
  framework: "none"
  frontend: "none"
  styling: "none"
  componentLibrary: "none"
  database: "none"
  orm: "none"
  testing: "none"
  iac: "none"
  cloud: "none"
  compute: "none"
  ci: "github-actions"

contract:
  apiSpec: "none"
  inputs: []
  outputs:
    - name: "*.md"
      type: "filesystem"
      description: "Markdown files consumed by src/web-app build pipeline"
  consumedBy:
    - "web-app"
  consumes: []
  breakingChangePolicy: "requires-human-approval"

data:
  ownsData: false
  dataContract: "none"
  tables: []
  schemaVersion: "0.0.0"
  migrationPath: "none"

scope:
  inScope:
    - "10 user-facing documentation pages for Planifest v0.10"
    - "Naming convention: NN-descriptive (01-overview through 10-templates)"
  outOfScope:
    - "Planning documents (belong in plan/)"
    - "Framework source files (belong in planifest-framework/)"
  deferred:
    - "API reference documentation (no public API surface yet)"
    - "Changelog/migration guide between versions"

risk:
  level: "low"
  items:
    - "Doc accuracy depends on framework source being read correctly at authoring time — human review is the final gate"

quality:
  testCoverage:
    unit: 0
    integration: 0
    e2e: 0
  techDebt: []
  quirks:
    - "Files must be named NN-descriptive.md — build-docs.js uses filesystem sort order for sitemap generation"

pipeline:
  templateVersion: "1.0.0"
  featureMode: "greenfield"
  domainKnowledgePath: "plan/current"

metadata:
  createdAt: "2026-05-16"
  updatedAt: "2026-05-16 (v0.2.0)"
  createdBy: "agent"
  lastModifiedBy: "agent"
  skill: "planifest-docs-agent"
  tool: "Claude Code"
  model: "claude-sonnet-4-6"
